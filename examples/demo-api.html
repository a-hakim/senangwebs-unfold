<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWU Demo - JavaScript API</title>
    <link rel="stylesheet" href="../dist/swu.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>  
    <div id="demo" class="w-full h-screen p-8"></div>

    <script src="../dist/swu.js"></script>
    <script>
        const demoEl = document.getElementById('demo');
        
        const sampleData = {
            project: "SenangWebs Unfold",
            version: 2.0,
            status: "In Development",
            config: {
                theme: "Flow",
                editable: true,
                defaultView: "Graph"
            },
            components: [
                { name: "Renderer", type: "Canvas" },
                { name: "Parser", type: "JavaScript" }
            ],
            features: {
                visualization: true,
                editing: true,
                panZoom: true,
                statePreservation: true
            },
            team: [
                { name: "Alice", role: "Developer" },
                { name: "Bob", role: "Designer" }
            ],
            active: true,
            metadata: null
        };
        
        const editor = new SWU(demoEl, {
            canvasBackground: '#f0f0f0',
            accentColor: '#9333ea',
            theme: 'light',
            json: sampleData
        });
        
        // Listen to events
        editor.on('onChange', (json) => {
            console.log('JSON changed:', json);
        });
        
        editor.on('onError', (error) => {
            console.error('JSON parse error:', error);
        });
        
        // Example: Get current JSON
        setTimeout(() => {
            console.log('Current JSON:', editor.getJson());
        }, 2000);
    </script>
</body>
</html>
